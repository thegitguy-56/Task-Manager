<div class="modal fade" id="createTaskModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create New Task</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"
                aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form method="post" action="{{ url_for('create_task') }}">
          <!-- top horizontal row -->
          <div class="row g-3 align-items-end">
            <div class="col-md-3">
              <label class="form-label small">Task Name</label>
              <input type="text" name="task_name" class="form-control" required>
            </div>

            <div class="col-md-3">
              <label class="form-label small">Description</label>
              <input type="text" name="description" class="form-control">
            </div>

            {% if current_user.role != 'member' %}
            <div class="col-md-2">
              <label class="form-label small">Team</label>
              <select id="teamSelect" name="team_id" class="form-select" required>
                <option value="">Team</option>
                {% for t in manager_teams %}
                <option value="{{ t.id }}"
                        {% if team_id and team_id|int == t.id %}selected{% endif %}>
                  {{ t.team_name }}
                </option>
                {% endfor %}
              </select>
            </div>
            {% else %}
            <input type="hidden" name="team_id" value="{{ current_user.team_id }}">
            {% endif %}

            <div class="col-md-2">
              <label class="form-label small">Assigned To</label>
              <select id="assignedSelect" name="assigned_to" class="form-select" required>
                {% if current_user.role == 'member' %}
                  <option value="{{ current_user.id }}" selected>
                    {{ current_user.name }} ({{ current_user.role }})
                  </option>
                {% else %}
                  <option value="">User</option>
                  {% for user in users %}
                  <option value="{{ user.id }}" data-team-id="{{ user.team_id or '' }}">
                    {{ user.name }} ({{ user.role }})
                  </option>
                  {% endfor %}
                {% endif %}
              </select>
            </div>

            <div class="col-md-2">
              <label class="form-label small">Priority</label>
              <select name="priority" class="form-select">
                <option value="">None</option>
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
            </div>
          </div>

          <!-- bottom row -->
          <div class="row g-3 mt-3 align-items-end">
            <div class="col-md-3">
              <label class="form-label small">Start Date</label>
              <input type="date" name="start_date" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label small">End Date</label>
              <input type="date" name="end_date" class="form-control">
            </div>
            <div class="col-md-6 d-flex justify-content-end">
              <button type="submit" class="btn btn-dark px-4">
                Create Task
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var teamSelect = document.getElementById('teamSelect');
  var assignedSelect = document.getElementById('assignedSelect');

  if (!teamSelect || !assignedSelect) return;

  // cache all user options (skip first placeholder)
  var allOptions = Array.from(assignedSelect.options).slice(1);

  teamSelect.addEventListener('change', function () {
    var teamId = teamSelect.value;

    // reset assignedSelect
    assignedSelect.innerHTML = '';
    var placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = 'User';
    assignedSelect.appendChild(placeholder);

    if (!teamId) {
      // no team selected -> only placeholder
      return;
    }

    // add only users whose data-team-id matches selected team
    allOptions.forEach(function (opt) {
      if (String(opt.dataset.teamId || '') === String(teamId)) {
        assignedSelect.appendChild(opt);
      }
    });
  });
});
</script>
